[project]
name = "ai-harness"
version = "0.1.0"
description = "FSM-routed, multi-agent software-engineering worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[project.scripts]
agent = "ai_harness.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_harness"]

# ── lint ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["E501", "RUF002", "RUF003"]  # en dashes are used deliberately in prose

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ── types ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_harness"]
exclude = "^(\\.venv|scripts)/"
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The OTel SDK is an optional extra; its absence is a supported state (see tracing.py).
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "tree_sitter_language_pack.*"]
ignore_missing_imports = true

# ── tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: touches a network; excluded from the default run",
]
filterwarnings = ["error::DeprecationWarning"]
